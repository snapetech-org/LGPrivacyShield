name: TV compatibility report
description: Report model, firmware, and read-access evidence for PrivacyShield
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        Use PrivacyShield's **Prepare compatibility report** action and validate the JSON with `python3 scripts/validate_compatibility_report.py report.json` before posting.

        Do not include a serial number, MAC or IP address, SSID, LG account, current setting values, agreement choices, or complete firmware/app bundles. PrivacyShield does not upload this report; posting here is your choice.
  - type: input
    id: model
    attributes:
      label: Full model code
      description: Include the regional suffix shown by the TV.
      placeholder: OLED65C4PUA
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Country or TV region
      placeholder: Canada
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: webOS SDK and firmware versions
      placeholder: SDK 11.2.0; firmware 43.21.79
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Validated compatibility report JSON
      description: Paste the complete output from Prepare compatibility report. Check it for private data before posting.
      render: json
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Menu path or observation
      description: Identify the setting label/path and what behavior you observed. Do not include current setting values or agreement choices.
      placeholder: Settings → General → System → Additional Settings → Live Plus is present; PrivacyShield reports the key readable.
    validations:
      required: true
  - type: input
    id: control
    attributes:
      label: Control label
      description: One setting, agreement, service, microphone path, or network behavior per issue.
      placeholder: Live Plus / ACR
    validations:
      required: false
  - type: textarea
    id: implementation_map
    attributes:
      label: Service, method, key, or file path
      description: Include only the mapped interface or source path and its allowed value names. Do not include the TV's current value or private data.
      placeholder: com.webos.service.settings / setSystemSettings / option.livePlus
    validations:
      required: false
  - type: dropdown
    id: access_context
    attributes:
      label: Where was this observed?
      options:
        - PrivacyShield packaged app
        - LG native Settings or First Use app
        - Root shell or boot service
        - Another rooted dashboard or app
        - Router, DNS, or packet capture
        - Published source or documentation only
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: read_result
    attributes:
      label: Read result
      options:
        - Not tested
        - Read succeeded (value omitted)
        - Read denied or unavailable
        - Conflicting results
    validations:
      required: true
  - type: dropdown
    id: write_result
    attributes:
      label: Reversible write and readback
      options:
        - Not tested
        - Write and matching readback confirmed
        - Readback did not match
        - Change could not be restored
    validations:
      required: true
  - type: textarea
    id: feature_effect
    attributes:
      label: Feature effects or limits
      description: Note which feature changed, whether the value survived a restart, and any known limits. Do not include setting values, personal data, or screenshots containing private TV information.
    validations:
      required: false
