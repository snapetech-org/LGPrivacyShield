name: TV compatibility report
description: Report model, firmware, and read-access evidence for LGPrivacyShield
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        Install the current IPK from the [latest release](https://github.com/snapetech-org/LGPrivacyShield/releases/latest). On the TV, open **Controls** and choose **Prepare compatibility report**. Scan the QR code with a phone to open this form with the report JSON pre-filled.

        Opening the link sends the report to GitHub as a URL parameter so this form can be filled in. It is not posted as an issue until you select Submit new issue.

        Use a report when your model or software is unmapped, or a control remains read-only. The report helps maintainers review model coverage and setting read access.

        Controls remain read-only on unmapped TVs. Do not try changing settings on an unmapped model to produce a report. To reproduce an observation, use the TV's native settings and report only the menu path and whether a read was available.

        Do not include a serial number, MAC or IP address, SSID, LG account, current setting values, agreement choices, or complete firmware/app bundles.
  - type: textarea
    id: report
    attributes:
      label: Compatibility report JSON
      description: The QR code fills this field. Review it before submitting; do not add setting values or identifiers.
      render: json
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Country or TV region (optional)
      description: The report does not include the TV region.
      placeholder: Canada
    validations:
      required: false
  - type: textarea
    id: observation
    attributes:
      label: Additional observation (optional)
      description: Identify the setting label/path and what behavior you observed. Do not include current setting values or agreement choices.
      placeholder: Settings → General → System → Additional Settings → Live Plus is present; LGPrivacyShield reports the key readable.
    validations:
      required: false
