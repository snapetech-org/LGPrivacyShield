title: PrivacyShield
iconUri: https://raw.githubusercontent.com/snapetech-org/PrivacyShield/main/webos-app/assets/privacyshield-icon.png
manifestUrl: https://github.com/snapetech-org/PrivacyShield/releases/latest/download/org.privacyshield.webos.manifest.json
category: system
pool: main
requirements:
  webosRelease: '>=6.0'
description: |
  Review 17 privacy settings, LG agreement status, local services, installed
  apps, diagnostic upload settings, and model references. Controls vary by
  model and webOS version. A switch is enabled only when the TV returns a
  readable value; each change is confirmed by readback. Unsupported settings
  remain read-only. PrivacyShield does not send setting values or viewing
  activity. A sanitized compatibility report can be shared by user action.
  Support development on [Ko-fi](https://ko-fi.com/snapetech).
funding:
  ko_fi: [snapetech]
